name: memory-integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run governance benchmark
        run: python tools/run_governance_benchmark.py

      - name: Self-test authoritative-state recovery evaluation
        run: python tools/recovery_eval.py selftest

      - name: Generate governed and ungoverned recovery prompts
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python tools/recovery_eval.py bundle "$tmp/prompts"
          test "$(find "$tmp/prompts" -maxdepth 1 -name '*.txt' | wc -l)" -eq 16
          test -f "$tmp/prompts/manifest.json"

      - name: Verify passing fixture
        run: python tools/memory_integrity_check.py examples/integrity-check/pass/memory-integrity.json

      - name: Verify failing fixture is rejected
        shell: bash
        run: |
          set +e
          output="$(python tools/memory_integrity_check.py examples/integrity-check/fail/memory-integrity.json)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          grep -q "OVERSIZED_CORE_MEMORY" <<< "$output"
          grep -q "DUPLICATE_AUTHORITY_DOMAIN" <<< "$output"
          grep -q "ORPHAN_BOOKMARK" <<< "$output"
          grep -q "STALE_REFERENCE" <<< "$output"
          grep -q "UNRESOLVED_CONTRADICTION" <<< "$output"

      - name: Smoke test Cline Memory Bank adapter
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          bank="$tmp/memory-bank"
          mkdir -p "$bank"
          for file in projectBrief.md productContext.md activeContext.md systemPatterns.md techContext.md progress.md; do
            printf '# %s\n' "$file" > "$bank/$file"
          done
          python tools/adapters/cline_memory_bank.py "$bank"
          python tools/memory_integrity_check.py "$bank/memory-integrity.json"
